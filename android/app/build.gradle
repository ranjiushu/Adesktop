// Desktop Android 应用模块构建脚本（最小 WebView 壳，零第三方运行时依赖）
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ranjiushu.adesktop'
    compileSdk 34

    defaultConfig {
        applicationId "com.ranjiushu.adesktop"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        // 开发期临时签名（复用 debug keystore）
        dev {
            storeFile file("${System.getenv('HOME')}/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // 正式发布签名：在 android/keystore.properties 配置（该文件已 gitignore，永不入库）
        // storeFile=... / storePassword=... / keyAlias=... / keyPassword=...（storeFile 为相对 android/ 的路径）
        release {
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(propsFile))
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // R8 裁剪（保留只用的 androidx 类，APK 体积从 1.5MB → 数百 KB）
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 有 keystore.properties 用正式签名，否则回退 debug 签名（CI/本地开发）
            def hasReleaseKey = rootProject.file('keystore.properties').exists()
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.dev
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // FileBridge 经 SAF（Storage Access Framework）访问真实文件系统
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // edge-to-edge 沉浸式：WindowInsetsCompat/WindowInsetsControllerCompat 跨版本
    // 安全区与系统栏图标明暗统一处理（与 LexiCull 同款，版本对齐）
    implementation 'androidx.core:core:1.12.0'
}
