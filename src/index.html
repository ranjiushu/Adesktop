<main id="app" class="app-shell">
  <header class="app-header">
    <button id="btn-drawer" class="btn-drawer" aria-label="打开菜单">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-menu"/></svg>
    </button>
    <h1 id="app-title">Desktop</h1>
    <button id="btn-view-menu" class="btn-view-menu" aria-label="排列与视图" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-more-vertical"/></svg>
    </button>
  </header>
  <section class="app-content">
    <div id="desktop-viewport" class="desktop-viewport">
      <div id="desktop-canvas" class="desktop-canvas">
        <div id="desktop-grid" class="desktop-grid"></div>
      </div>
      <div id="desktop-marquee" class="desktop-marquee"></div>
      <!-- 文件查看器 Overlay Layer：canvas 态实体位于 desktop-canvas 内；
           全屏态进入 #viewer-fs-page（独立新页面，见 viewer.js / viewer.css） -->
      <div id="viewer-layer" class="viewer-layer" aria-hidden="true"></div>
    </div>
  </section>

<!-- ===== 文件查看器全屏页（Viewer 的全屏状态 = 简洁新页面，退出回到原页面状态） ===== -->
<div id="viewer-fs-page" class="viewer-fs-page" aria-hidden="true"></div>
</main>

<!-- ===== 底部工具栏：5 个矢量图标按钮，中间加号弹新建对话框 =====
     左1 后退 / 左2 前进 / 中间加号 新建 / 右1 Home（点按回空间锚点视角，长按记录位置快照）
     / 右2 上级目录。底栏区域右滑可跟手呼出左侧 Drawer（见 drawer-swipe.js） -->
<nav id="bottom-bar" class="bottom-bar" aria-label="底部工具栏">
  <button id="bb-btn-back" class="bottom-bar-btn" aria-label="后退" aria-disabled="true" disabled>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-arrow-left"/></svg>
  </button>
  <button id="bb-btn-forward" class="bottom-bar-btn" aria-label="前进" aria-disabled="true" disabled>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-arrow-right"/></svg>
  </button>
  <button id="bb-btn-add" class="bottom-bar-btn bottom-bar-add" aria-label="新建">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-plus"/></svg>
  </button>
  <button id="bb-btn-home" class="bottom-bar-btn" aria-label="Home" aria-disabled="true" disabled>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-home"/></svg>
  </button>
  <button id="bb-btn-up" class="bottom-bar-btn" aria-label="上级目录" aria-disabled="true" disabled>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-arrow-up"/></svg>
  </button>
</nav>

<!-- ===== 新建对话框（加号弹出）：输入名称，点「文件/文件夹」按对应类型创建 ===== -->
<div id="create-dialog-overlay" class="dialog-overlay" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="create-dialog-title">
    <h2 id="create-dialog-title" class="dialog-title">新建</h2>
    <input id="create-name" class="dialog-input" type="text" placeholder="名称" autocomplete="off" enterkeyhint="done" aria-label="名称">
    <div class="dialog-actions dialog-actions-pair">
      <button id="create-file" class="dialog-btn dialog-btn-primary">文件</button>
      <button id="create-folder" class="dialog-btn dialog-btn-secondary">文件夹</button>
    </div>
  </div>
</div>


<!-- ===== 新建网站快捷方式对话框（Drawer「新建网站」弹出）：网址 + 可选名称 ===== -->
<div id="website-dialog-overlay" class="dialog-overlay" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="website-dialog-title">
    <h2 id="website-dialog-title" class="dialog-title">新建网站</h2>
    <input id="website-url" class="dialog-input" type="text" placeholder="网址（如 example.com）" autocomplete="off" enterkeyhint="next" aria-label="网址">
    <input id="website-label" class="dialog-input" type="text" placeholder="名称（可选）" autocomplete="off" enterkeyhint="done" aria-label="名称">
    <label class="website-trust">
      <input type="checkbox" id="website-trusted">
      <span>信任该网站（允许完整功能，可读写授权目录）</span>
    </label>
    <div class="dialog-actions">
      <button id="website-create" class="dialog-btn dialog-btn-primary">创建</button>
    </div>
  </div>
</div>

<!-- ===== 重命名对话框（选中态操作栏「重命名」弹出）：预填原名，确认后执行 ===== -->
<div id="rename-dialog-overlay" class="dialog-overlay" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="rename-dialog-title">
    <h2 id="rename-dialog-title" class="dialog-title">重命名</h2>
    <input id="rename-name" class="dialog-input" type="text" autocomplete="off" enterkeyhint="done" aria-label="新名称">
    <div class="dialog-actions">
      <button id="rename-confirm" class="dialog-btn dialog-btn-primary">确认</button>
    </div>
  </div>
</div>

<!-- ===== 顶栏排列/视图菜单（子文件夹容器模式可用，根目录空间置灰） ===== -->
<div id="view-menu-overlay" class="view-menu-overlay" aria-hidden="true"></div>
<nav id="view-menu" class="view-menu" aria-hidden="true">
  <div class="view-menu-section">
    <div class="view-menu-label">排列方式</div>
    <button class="view-menu-item" data-sort="name">按名称<i class="view-menu-dir"></i></button>
    <button class="view-menu-item" data-sort="mtime">按修改日期<i class="view-menu-dir"></i></button>
    <button class="view-menu-item" data-sort="type">按类型<i class="view-menu-dir"></i></button>
    <button class="view-menu-item" data-sort="size">按大小<i class="view-menu-dir"></i></button>
  </div>
  <div class="view-menu-sep"></div>
  <div class="view-menu-section">
    <div class="view-menu-label">视图</div>
    <button class="view-menu-item" data-view="grid">网格<i class="view-menu-check">✓</i></button>
    <button class="view-menu-item" data-view="list">列表<i class="view-menu-check">✓</i></button>
  </div>
  <div class="view-menu-sep view-menu-sep-browse"></div>
  <div class="view-menu-section view-menu-section-browse">
    <button class="view-menu-item view-menu-browse" data-browse="advanced">高级浏览模式<i class="view-menu-check">✓</i></button>
  </div>
  <div class="view-menu-hint">打开文件夹后可用</div>
</nav>

<!-- ===== 左侧 Drawer 工具栏（汉堡呼出） ===== -->
<div id="drawer-overlay" class="drawer-overlay"></div>
<nav id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-header">
    <span class="drawer-title">工具栏</span>
    <button class="drawer-close" aria-label="关闭菜单">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-close"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <div class="drawer-section">
      <div class="drawer-label">根目录</div>
      <div class="drawer-root-path" id="drawer-root-path">未知</div>
      <div class="drawer-root-mode" id="drawer-root-mode"></div>
    </div>
    <div class="drawer-section">
      <div class="drawer-label">操作</div>
      <button class="drawer-item" data-action="switch-root">
        <span class="drawer-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-folder-move"/></svg></span><span>切换根目录</span>
      </button>
      <button class="drawer-item" data-action="installed-apps">
        <span class="drawer-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-smartphone"/></svg></span><span>已安装应用</span>
      </button>
      <button class="drawer-item" data-action="new-website">
        <span class="drawer-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-external-link"/></svg></span><span>新建网站</span>
      </button>
      <button class="drawer-item" id="btn-build-info">
        <span class="drawer-item-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-wrench"/></svg></span><span>提交与构建</span>
      </button>
    </div>
  </div>
</nav>

<!-- ===== 提交与构建信息面板 ===== -->
<div id="buildinfo" class="buildinfo" role="dialog" aria-hidden="true">
  <header class="buildinfo-header">
    <button id="buildinfo-back" class="buildinfo-back" aria-label="返回">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-chevron-left"/></svg>
    </button>
    <span class="buildinfo-title">提交与构建</span>
    <span class="buildinfo-header-spacer"></span>
  </header>
  <div class="buildinfo-body" id="buildinfo-body"></div>
</div>

<!-- ===== 已安装应用面板（Drawer「已安装应用」工具）：搜索 + 点按确认生成应用快捷方式 ===== -->
<div id="app-list" class="app-list" role="dialog" aria-hidden="true">
  <header class="app-list-header">
    <button id="app-list-back" class="app-list-back" aria-label="返回">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-chevron-left"/></svg>
    </button>
    <span class="app-list-title">已安装应用</span>
    <span class="app-list-header-spacer"></span>
  </header>
  <div class="app-list-search">
    <input id="app-list-search-input" class="app-list-search-input" type="text" placeholder="搜索应用" autocomplete="off" enterkeyhint="search" aria-label="搜索应用">
  </div>
  <div class="app-list-body" id="app-list-body"></div>
</div>

<!-- ===== 添加应用快捷方式确认框（复用 dialog-overlay 结构） ===== -->
<div id="app-list-confirm-overlay" class="dialog-overlay" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="app-list-confirm-title">
    <h2 id="app-list-confirm-title" class="dialog-title">添加快捷方式</h2>
    <p id="app-list-confirm-desc" class="app-list-confirm-desc"></p>
    <div class="dialog-actions">
      <button id="app-list-confirm-ok" class="dialog-btn dialog-btn-primary">添加</button>
    </div>
  </div>
</div>

<!-- ===== 网页上传确认框（拖拽文件到网站后点上传，网页请求文件时弹出） ===== -->
<div id="web-upload-confirm-overlay" class="dialog-overlay" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="web-upload-confirm-title">
    <h2 id="web-upload-confirm-title" class="dialog-title">上传文件</h2>
    <p id="web-upload-confirm-desc" class="app-list-confirm-desc"></p>
    <div class="dialog-actions dialog-actions-pair">
      <button id="web-upload-confirm-use" class="dialog-btn dialog-btn-primary">用待上传文件</button>
      <button id="web-upload-confirm-system" class="dialog-btn dialog-btn-secondary">重新选择</button>
    </div>
  </div>
</div>

<!-- ===== Morph FAB + Speed Dial（短按展开菜单 / 长按 800ms 激活取景器） ===== -->
<button id="mode-switch-fab" class="mode-switch-fab" title="更多选项" aria-label="更多选项">
  <svg class="fab-icon-plus" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-plus"/></svg>
  <svg class="fab-icon-close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-close"/></svg>
</button>

<!-- Speed Dial 遮罩 -->
<div id="fab-backdrop" class="fab-backdrop"></div>

<!-- Speed Dial 子按钮容器（近 = 高频操作） -->
<div id="fab-speed-dial" class="fab-speed-dial">
  <div class="fab-btn-set fab-set-preview">
    <button class="fab-child fab-child-up" data-action="new-folder"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-folder"/></svg>
      <span class="fab-child-label">新建文件夹</span>
    </button>
    <button class="fab-child fab-child-up" data-action="new-file"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-file"/></svg>
      <span class="fab-child-label">新建文件</span>
    </button>
    <button class="fab-child fab-child-up" data-action="refresh"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-refresh-cw"/></svg>
      <span class="fab-child-label">刷新</span>
    </button>
    <button class="fab-child fab-child-up" data-action="paste"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-copy"/></svg>
      <span class="fab-child-label">粘贴</span>
    </button>
  </div>
  <!-- 选中态操作栏按钮集（selection 非空时自动展开）：
       Viewer 打开时仅显示 全屏预览 / 关闭预览（2、3 位），文件操作隐藏；
       Viewer 关闭时显示 打开/复制/剪切/重命名/取消选择 -->
  <div class="fab-btn-set fab-set-selection">
    <button class="fab-child fab-child-up" data-action="open"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-folder"/></svg>
      <span class="fab-child-label">打开</span>
    </button>
    <button class="fab-child fab-child-up" data-action="fullscreen-preview"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-maximize"/></svg>
      <span class="fab-child-label">全屏预览</span>
    </button>
    <button class="fab-child fab-child-up" data-action="close-preview"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-close"/></svg>
      <span class="fab-child-label">关闭预览</span>
    </button>
    <button class="fab-child fab-child-up" data-action="copy"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-copy"/></svg>
      <span class="fab-child-label">复制</span>
    </button>
    <button class="fab-child fab-child-up" data-action="cut"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-scissors"/></svg>
      <span class="fab-child-label">剪切</span>
    </button>
    <button class="fab-child fab-child-up" data-action="rename"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-edit"/></svg>
      <span class="fab-child-label">重命名</span>
    </button>
    <button class="fab-child fab-child-up" data-action="delete"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-trash"/></svg>
      <span class="fab-child-label">删除</span>
    </button>
    <button class="fab-child fab-child-up" data-action="clear-selection"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#icon-close"/></svg>
      <span class="fab-child-label">取消选择</span>
    </button>
  </div>
</div>

<!-- ===== Loading Feedback：居中对话框（进度条）+ 实时标签（拖入文件夹提示） ===== -->
<!-- 复用 dialog-overlay / dialog 结构（矩形 76vw），显隐经 App.Dialog 管理 -->
<div id="loading-dialog" class="dialog-overlay loading-dialog" aria-hidden="true">
  <div class="dialog loading-dialog-card">
    <div id="loading-dialog-title" class="loading-dialog-title"></div>
    <div id="loading-current" class="loading-current">
      <span id="loading-current-label" class="loading-row-label"></span>
      <span id="loading-current-count" class="loading-row-count"></span>
    </div>
    <div id="loading-phase" class="loading-phase">
      <div class="loading-row">
        <span id="loading-phase-label" class="loading-row-label"></span>
        <span id="loading-phase-count" class="loading-row-count"></span>
      </div>
      <div class="loading-track"><div id="loading-phase-bar" class="loading-bar"></div></div>
    </div>
    <div id="loading-total" class="loading-total">
      <div class="loading-row">
        <span id="loading-total-label" class="loading-row-label"></span>
        <span id="loading-total-count" class="loading-row-count"></span>
      </div>
      <div class="loading-track"><div id="loading-total-bar" class="loading-bar"></div></div>
    </div>
    <div id="loading-actions" class="loading-actions">
      <button id="loading-cancel" class="dialog-btn dialog-btn-secondary" type="button">取消</button>
    </div>
  </div>
</div>

<!-- ===== 批量操作失败汇总（转移失败后弹出：成功 N / 失败 M + 逐项原因） ===== -->
<div id="transfer-fail-overlay" class="dialog-overlay" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="transfer-fail-title">
    <h2 id="transfer-fail-title" class="dialog-title">部分操作失败</h2>
    <p id="transfer-fail-summary" class="transfer-fail-summary"></p>
    <ul id="transfer-fail-list" class="transfer-fail-list"></ul>
    <div class="dialog-actions">
      <button id="transfer-fail-ok" class="dialog-btn dialog-btn-primary" type="button">知道了</button>
    </div>
  </div>
</div>

<div id="drop-tag" class="drop-tag" aria-hidden="true"></div>

<script>
// __JS_PLACEHOLDER__
</script>
</body>
</html>
