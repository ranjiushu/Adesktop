<!-- 应用骨架：HTML 入口，样式与脚本占位由构建脚本替换 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<title>Desktop</title>
<style>
/* __STYLE_PLACEHOLDER__ */
</style>
</head>
<body>
<main id="app" class="app-shell">
  <header class="app-header">
    <button id="btn-drawer" class="btn-drawer" aria-label="打开菜单">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <h1 id="app-title">Desktop</h1>
  </header>
  <section class="app-content">
    <div id="desktop-viewport" class="desktop-viewport">
      <div id="desktop-canvas" class="desktop-canvas">
        <div id="desktop-grid" class="desktop-grid"></div>
      </div>
      <div id="desktop-marquee" class="desktop-marquee"></div>
    </div>
    <p id="status-text" class="status-text">初始化中...</p>
  </section>
</main>

<!-- ===== 底部工具栏：5 个矢量图标按钮，中间加号弹新建对话框，其余 UI 占位 =====
     底栏区域右滑可跟手呼出左侧 Drawer（见 drawer-swipe.js） -->
<nav id="bottom-bar" class="bottom-bar" aria-label="底部工具栏">
  <button class="bottom-bar-btn" aria-label="占位按钮 1">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  </button>
  <button class="bottom-bar-btn" aria-label="占位按钮 2">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
  </button>
  <button id="bb-btn-add" class="bottom-bar-btn bottom-bar-add" aria-label="新建">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
  <button class="bottom-bar-btn" aria-label="占位按钮 4">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
  </button>
  <button class="bottom-bar-btn" aria-label="占位按钮 5">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</nav>

<!-- ===== 新建对话框（加号弹出）：输入名称，点「文件/文件夹」按对应类型创建 ===== -->
<div id="create-dialog-overlay" class="dialog-overlay" aria-hidden="true">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="create-dialog-title">
    <h2 id="create-dialog-title" class="dialog-title">新建</h2>
    <input id="create-name" class="dialog-input" type="text" placeholder="名称" autocomplete="off" enterkeyhint="done" aria-label="名称">
    <div class="dialog-actions dialog-actions-triple">
      <button id="create-cancel" class="dialog-btn">取消</button>
      <button id="create-file" class="dialog-btn dialog-btn-primary">文件</button>
      <button id="create-folder" class="dialog-btn dialog-btn-secondary">文件夹</button>
    </div>
  </div>
</div>

<!-- ===== 左侧 Drawer 工具栏（汉堡呼出） ===== -->
<div id="drawer-overlay" class="drawer-overlay"></div>
<nav id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-header">
    <span class="drawer-title">工具栏</span>
    <button class="drawer-close" aria-label="关闭菜单">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <div class="drawer-section">
      <div class="drawer-label">根目录</div>
      <div class="drawer-root-path" id="drawer-root-path">未知</div>
      <div class="drawer-root-mode" id="drawer-root-mode"></div>
    </div>
    <div class="drawer-section">
      <div class="drawer-label">操作</div>
      <button class="drawer-item" data-action="new-folder">
        <span class="drawer-item-icon">📁</span><span>新建文件夹</span>
      </button>
      <button class="drawer-item" data-action="new-file">
        <span class="drawer-item-icon">📄</span><span>新建文件</span>
      </button>
      <button class="drawer-item" data-action="refresh">
        <span class="drawer-item-icon">🔄</span><span>刷新</span>
      </button>
      <button class="drawer-item" data-action="switch-root">
        <span class="drawer-item-icon">🗂️</span><span>切换根目录</span>
      </button>
      <button class="drawer-item" id="btn-build-info">
        <span class="drawer-item-icon">🔨</span><span>提交与构建</span>
      </button>
    </div>
  </div>
</nav>

<!-- ===== 提交与构建信息面板 ===== -->
<div id="buildinfo" class="buildinfo" role="dialog" aria-hidden="true">
  <header class="buildinfo-header">
    <button id="buildinfo-back" class="buildinfo-back" aria-label="返回">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="buildinfo-title">提交与构建</span>
    <span class="buildinfo-header-spacer"></span>
  </header>
  <div class="buildinfo-body" id="buildinfo-body"></div>
</div>

<!-- ===== Morph FAB + Speed Dial（短按展开菜单 / 长按 800ms 激活取景器） ===== -->
<button id="mode-switch-fab" class="mode-switch-fab" title="更多选项" aria-label="更多选项">
  <svg class="fab-icon-plus" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  <svg class="fab-icon-close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
</button>

<!-- Speed Dial 遮罩 -->
<div id="fab-backdrop" class="fab-backdrop"></div>

<!-- Speed Dial 子按钮容器（近 = 高频操作） -->
<div id="fab-speed-dial" class="fab-speed-dial">
  <div class="fab-btn-set fab-set-preview">
    <button class="fab-child fab-child-up" data-action="new-folder">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span class="fab-child-label">新建文件夹</span>
    </button>
    <button class="fab-child fab-child-up" data-action="new-file">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
      <span class="fab-child-label">新建文件</span>
    </button>
    <button class="fab-child fab-child-up" data-action="refresh">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      <span class="fab-child-label">刷新</span>
    </button>
    <button class="fab-child fab-child-up" data-action="switch-root">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
      <span class="fab-child-label">切换根目录</span>
    </button>
  </div>
  <!-- 选中态操作栏按钮集（selection 非空时自动展开） -->
  <div class="fab-btn-set fab-set-selection">
    <button class="fab-child fab-child-up" data-action="open">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span class="fab-child-label">打开</span>
    </button>
    <button class="fab-child fab-child-up" data-action="rename">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>
      <span class="fab-child-label">重命名</span>
    </button>
    <button class="fab-child fab-child-up" data-action="delete">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      <span class="fab-child-label">删除</span>
    </button>
    <button class="fab-child fab-child-up" data-action="properties">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
      <span class="fab-child-label">属性</span>
    </button>
    <button class="fab-child fab-child-up" data-action="clear-selection">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      <span class="fab-child-label">取消选择</span>
    </button>
  </div>
</div>

<script>
// __JS_PLACEHOLDER__
</script>
</body>
</html>
